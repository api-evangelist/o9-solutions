aid: o9-solutions
name: o9 Solutions
description: 'o9 Solutions is an enterprise AI platform for integrated planning and
  decision-making, founded in 2009 by Sanjiv Sidhu (previously founder of i2 Technologies)
  and Chakri Gottemukkala, and headquartered in Dallas, Texas. Its o9 Digital Brain
  platform unifies supply chain, commercial and financial planning on a patented Enterprise
  Knowledge Graph (EKG) — an always-on digital twin of the enterprise — supporting
  demand planning, AI/ML forecasting, supply chain master planning, control tower,
  multi-echelon inventory optimization, supplier relationship management, revenue growth
  management, merchandise planning and ESG planning. The platform ingests enterprise
  data via SFTP batch, REST API, SOAP XML and streaming, with connectors to SAP, Oracle,
  Snowflake, Databricks and Google BigQuery. o9 publishes two API surfaces — the o9
  Platform API (public UI APIs over the GraphCube server) and the o9 Reference Model
  API (SAP and inbound staging batch integration) — but both API references sit behind
  the customer/partner OAuth login at guide.o9solutions.com, so no machine-readable
  contract is publicly available.'
